profile: top_journal_mechanism_v49_retrospective_handoff_mappo
base_profile: top_journal_mechanism_v46_net_utility_constrained_mappo
purpose: >
  Offset-free MAPPO candidate that addresses the v47/v48 mechanism-collapse
  root cause: predictor-visible handoff candidates can be zero even when the
  trajectory contains true near-future handoff opportunities.
algorithm_delta:
  - Adds retrospective handoff auxiliary labels during training only. Labels are
    computed from realized trajectory frames after each collected transition and
    are used as event-head auxiliary loss/transition weighting, not as online
    policy input or evaluator filtering.
  - Uses a shared longer baseline prediction horizon of 8 steps so benchmark
    actions keep the same predictor protocol for SA-GHMAPPO and all baselines.
  - Keeps v46 constrained net-utility PRD and MAPPO actor/critic learning; adds
    only a light service-fill bias and disables the v47 repeated-fill guard.
  - Does not modify environment reward, baseline contracts, or result filtering.
    It requires mechanism-window coverage during training so MAPPO receives
    executable handoff opportunities instead of all active_non episodes.
negative_controls:
  - top_journal_mechanism_v47_service_backhaul_mappo collapsed by suppressing
    prepare/prefetch under weak predictor signals.
  - top_journal_mechanism_v48_service_fill_mappo preserved prepare logits but
    still produced zero guided mechanism transitions because no retrospective
    target entered MAPPO learning.
reward_protocol:
  reward_positive_offset: 0.0
  offset_free: true
  offset_adjusted_total_reward_reported: true
training_budget:
  episodes: 128
  update_every: 8
  batch_size: 32
  train_window_count: 20
  max_steps: 22
training_window_protocol:
  window_mode: mixed_informative
  mechanism_window_oversample_ratio: 2.25
  handoff_imminent_oversample_ratio: 1.50
  target_mismatch_sample_weight: 1.50
  min_mechanism_activating_windows: 4
prediction_protocol:
  predictor_kind: baseline
  prediction_horizon: 8
  shared_by_all_benchmark_agents: true
retrospective_handoff_auxiliary:
  retrospective_handoff_aux_enabled: true
  retrospective_handoff_aux_max_eta: 6.0
  retrospective_handoff_aux_min_score: 0.08
  retrospective_handoff_aux_prepare_weight: 0.72
  retrospective_handoff_aux_transition_weight: 1.60
paper_claim_boundary: >
  Candidate only. It may advance to formal/holdout only if full-pool dev
  benchmark beats PPO, MAPPO, and rule baselines without reward offset and with
  complete provenance/statistical audits.
