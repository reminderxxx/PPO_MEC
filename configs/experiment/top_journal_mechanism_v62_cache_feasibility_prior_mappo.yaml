profile: top_journal_mechanism_v62_cache_feasibility_prior_mappo
base_profile: top_journal_mechanism_v61_adapter_miss_counterfactual_mappo
purpose: >
  Offset-free MAPPO candidate that targets the v61 root cause: the learned
  policy still selected steady service in mechanism windows when the current
  RSU existed but did not hold the required adapter, causing adapter misses,
  stalls, and continuity loss.
algorithm_delta:
  - Adds a cache-feasibility policy prior inside the centralized hierarchical
    MAPPO policy. When the semantic state says the current RSU lacks the
    required adapter, the prior raises cache-fill logits and lowers steady
    service logits before sampling and PPO updates.
  - Applies only as a soft logit-level inductive bias; it does not replace
    actions after the policy acts and does not change benchmark reward
    accounting.
  - Suppresses early prepare/prefetch only when the handoff signal is weak or
    the predicted target is not valid, preserving learned predictive handoff
    behavior when the centralized state supports it.
  - Keeps v61 adapter-miss counterfactual credit and v60 risk-adjusted
    recovery, but makes the cache feasibility signal visible to the actor
    during training instead of only shaping sampled-transition losses.
negative_controls:
  - Corrected v61 improves idle and active non-mechanism windows but still loses
    total reward against PPO, popularity, and DT because mechanism windows
    carry high adapter miss and stall costs.
  - v62 must be judged by corrected mixed_informative and full_stratified
    benchmark artifacts, not by training reward alone.
reward_protocol:
  reward_positive_offset: 0.0
  offset_free: true
  offset_adjusted_total_reward_reported: true
training_budget:
  episodes: 128
  update_every: 8
  batch_size: 32
  train_window_count: 20
  max_steps: 22
training_window_protocol:
  window_mode: full_stratified
  train_window_mode: rotate
post_training_audit_protocol:
  default_mode: compact
  compact_scope: 1_window_x_1_workflow
  full_protocol_required_for_paper_ready: true
  repair_best_record_from_compact_audit: false
prediction_protocol:
  predictor_kind: baseline
  predictor_name: baseline_predictor_v3
  prediction_horizon: 16
  shared_by_all_benchmark_agents: true
cache_feasibility_prior:
  cache_feasibility_prior_enabled: true
  cache_feasibility_cache_fill_bias: 5.70
  cache_feasibility_steady_penalty: 7.40
  cache_feasibility_prepare_penalty: 1.10
  cache_feasibility_prefetch_penalty: 1.35
  cache_feasibility_min_context: 0.0
adapter_miss_counterfactual_learning:
  env_action_adapter_miss_counterfactual_coef: 3.15
  env_action_risk_adjusted_recovery_coef: 2.55
  env_action_sparse_recovery_focus: 0.34
  env_action_counterfactual_margin_enabled: true
  counterfactual_teacher_prd_enabled: true
paper_claim_boundary: >
  Candidate only. It can support a paper claim only after independent formal,
  holdout, and support-suite artifacts with complete provenance show robust
  superiority without hidden tuning or overlap leakage.
