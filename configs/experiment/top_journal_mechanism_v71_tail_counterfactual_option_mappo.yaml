profile: top_journal_mechanism_v71_tail_counterfactual_option_mappo
base_profile: clean_sa_ghmappo
purpose: >
  Learn rare cross-RSU handoff options from environment returns with an
  option-conditioned centralized critic and a counterfactual MAPPO baseline.
  Sparse handoff context changes training weight only; it never adds an
  inference-time action or logit override.

algorithm_delta:
  - Adds a learned centralized option critic Q(s, o) on the shared graph state.
  - Fits selected option values to normalized Monte Carlo returns.
  - Uses Q(s, o) minus the policy-weighted option value as MAPPO option credit.
  - Uses the normalized learned option advantage for critic-guided policy improvement.
  - Reweights rare sparse-handoff critic samples using observable context.
  - Disables fixed sparse recovery logits, option priors, heuristic imitation,
    reward-side PRD credit, guards, and evaluator-side policy changes.

reward_protocol:
  reward_positive_offset: 0.0
  offset_free: true
  prediction_horizon: 16
  reward_shaping_added: false

training_budget:
  primary_vehicle_selection: handoff_pressure
  episodes: 256
  update_every: 8
  batch_size: 64
  learning_rate: 0.0001
  clip_ratio: 0.12
  target_kl: 0.015
  train_window_count: 20
  train_window_mode: rotate
  window_mode: full_stratified
  max_steps: 22
  temporal_reward_shaping_enabled: false
  update_eval_max_windows: 4
  update_eval_max_workflows: 1
  post_training_audit_mode: compact

algorithm:
  option_counterfactual_policy_improvement_enabled: true
  option_counterfactual_policy_improvement_coef: 1.0
  option_counterfactual_policy_improvement_clip: 2.0

checkpoint_protocol:
  closed_loop_priority: latest_after_fixed_budget
  selection_source: no_benchmark_selection
  disallowed_claim: benchmark_selected_checkpoint

claim_boundary:
  paper_claim_ready: false
  note: >
    Promotion requires a newly frozen non-overlapping split, five-seed
    equal-budget baselines, full reward statistics, mechanism ablations, and
    one-time hidden-holdout confirmation.
