profile: top_journal_mechanism_v58_ready_aware_counterfactual_mappo
base_profile: top_journal_mechanism_v57_service_continuity_counterfactual_mappo
purpose: >
  Offset-free MAPPO candidate that directly addresses the v57 failure mode:
  idle_or_sparse windows still collapsed to popularity-like local execution,
  while PPO/DT maintained RSU service continuity and higher handoff readiness.
algorithm_delta:
  - Enables counterfactual-teacher PRD for env-action PPO, option-gate PPO,
    and event credit, so centralized MAPPO updates learn anti-local and
    ready-aware service-continuity advantages rather than relying on a
    deterministic evaluator wrapper.
  - Adds an env-action counterfactual margin loss. For each centralized-state
    sample, the valid action with highest service-continuity teacher credit is
    pushed above the selected action under the PPO ratio/clip budget.
  - Keeps mechanism candidates available in idle_or_sparse only when the
    centralized prediction/coverage context indicates recovery opportunity,
    and gives that option a deterministic prior margin during evaluation.
  - Adds no-current-RSU prepare and service-continuity logit bias inside the
    policy, while suppressing local fallback, so actor learning and execution
    share the same target.
  - Keeps reward function, environment transition, action schema, benchmark
    consumer, baseline checkpoints, and window selection unchanged.
negative_controls:
  - v56 showed handoff-memory guards did not fire in benchmark.
  - v57 improved over PPO/MAPPO on mixed windows but still lost to cache/DT and
    lost to PPO/DT on full_stratified because local_exec_count remained high in
    idle_or_sparse.
  - v58 is not reward offset, post-hoc result filtering, evaluator wrapping, or
    baseline weakening.
reward_protocol:
  reward_positive_offset: 0.0
  offset_free: true
  offset_adjusted_total_reward_reported: true
training_budget:
  episodes: 128
  update_every: 8
  batch_size: 32
  train_window_count: 20
  max_steps: 22
training_window_protocol:
  window_mode: mixed_informative
  mechanism_window_oversample_ratio: 2.25
  handoff_imminent_oversample_ratio: 1.50
  target_mismatch_sample_weight: 1.50
  min_mechanism_activating_windows: 4
post_training_audit_protocol:
  default_mode: compact
  compact_scope: 1_window_x_1_workflow
  full_protocol_required_for_paper_ready: true
  repair_best_record_from_compact_audit: false
prediction_protocol:
  predictor_kind: baseline
  predictor_name: baseline_predictor_v3
  prediction_horizon: 16
  shared_by_all_benchmark_agents: true
ready_aware_counterfactual:
  counterfactual_teacher_prd_enabled: true
  env_action_counterfactual_margin_enabled: true
  idle_recovery_mechanism_prior_enabled: true
  no_current_rsu_prepare_bias: true
  no_current_rsu_any_action_override: true
paper_claim_boundary: >
  Candidate only. It may advance to paper-ready only if independent formal,
  holdout, and support-suite artifacts with multi-seed statistics and full
  provenance show robust superiority without hidden tuning or overlap leakage.
