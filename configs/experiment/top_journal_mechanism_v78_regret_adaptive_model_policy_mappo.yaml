profile: top_journal_mechanism_v78_regret_adaptive_model_policy_mappo
base_profile: top_journal_mechanism_v77_temporal_downside_model_policy_mappo
purpose: >
  Convert rare but high-value counterfactual recovery states into effective
  actor updates through regret-adaptive trust regions and prioritized loss.

algorithm_delta:
  - Extends exact native-action digital-twin evaluation to horizons 1, 2, 4, 8, and 16.
  - Retains sparse-horizon lambda returns and one-sided temporal-downside control.
  - Measures normalized counterfactual regret between the actor distribution and the best model action.
  - Expands the per-state KL budget only when counterfactual regret is high, capped at 0.35.
  - Prioritizes high-regret actor distillation losses without action-specific labels or failure rules.
  - Retains clipped MAPPO as the on-policy objective and observable outcome memory.
  - Adds no reward shaping, teacher policy, action guard, fixed prior, or evaluator override.

failure_addressed:
  source_profile: top_journal_mechanism_v77_temporal_downside_model_policy_mappo
  observed_failure: >
    Exact H8/H16 digital-twin returns strongly preferred current-RSU cache fill
    after failed preparation, but the global KL 0.03 target and uniform
    minibatch weighting could not overcome the actor's 0.70-0.80 prepare
    probability in rare no-progress states.
  correction: >
    Counterfactual regret controls both the local policy trust-region budget
    and auxiliary loss priority, allowing strong exact-model evidence to
    update rare recovery states while retaining conservative updates elsewhere.

reward_protocol:
  reward_positive_offset: 0.0
  offset_free: true
  prediction_horizon: 16
  reward_shaping_added: false

training_budget:
  primary_vehicle_selection: handoff_pressure
  episodes: 256
  update_every: 8
  batch_size: 64
  learning_rate: 0.0001
  clip_ratio: 0.12
  target_kl: 0.015
  train_window_count: 20
  train_window_mode: rotate
  window_mode: full_stratified
  max_steps: 22
  temporal_reward_shaping_enabled: false
  update_eval_max_windows: 4
  update_eval_max_workflows: 1
  post_training_audit_mode: compact

algorithm:
  outcome_memory_fusion_enabled: true
  outcome_memory_actor_scale: 0.7
  outcome_memory_critic_scale: 0.85
  env_action_model_critic_enabled: true
  env_action_model_critic_value_coef: 0.5
  env_action_model_critic_advantage_coef: 0.0
  env_action_model_critic_policy_improvement_coef: 0.0
  env_action_model_policy_improvement_enabled: true
  env_action_model_policy_improvement_coef: 0.35
  env_action_model_policy_improvement_robust_horizons_enabled: true
  env_action_model_policy_improvement_horizon_aggregation_mode: lambda_downside
  env_action_model_policy_improvement_horizon_lambda: 0.9
  env_action_model_policy_improvement_horizon_risk_coef: 0.75
  env_action_model_policy_improvement_adaptive_kl_enabled: true
  env_action_model_policy_improvement_target_kl: 0.03
  env_action_model_policy_improvement_regret_adaptive_kl_enabled: true
  env_action_model_policy_improvement_max_target_kl: 0.35
  env_action_model_policy_improvement_regret_priority_coef: 2.0
  env_action_model_rollout_enabled: true
  env_action_model_rollout_horizons: [1, 2, 4, 8, 16]
  env_action_ppo_enabled: true
  env_action_ppo_coef: 0.35

compute_accounting:
  model_query_unit: valid_native_action_per_training_state
  model_transition_unit: simulated_branch_step
  paper_requirement: report real transitions, model queries, model transitions, wall time, and memory

checkpoint_protocol:
  closed_loop_priority: latest_after_fixed_budget
  selection_source: no_benchmark_selection
  disallowed_claim: benchmark_selected_checkpoint

claim_boundary:
  paper_claim_ready: false
  note: >
    Promotion requires all-baseline development evidence, independent formal
    and hidden confirmation, equal-budget baselines, ablations, and support
    experiments under the frozen protocol.
